[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lego-robot-agent"
version = "0.1.0"
description = "LEGO Robot Agent - Multi-agent orchestration for LEGO robot control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LEGO Agent Team"}
]
keywords = ["lego", "robot", "agent", "ai", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "agent-framework==1.0.0b260107",
    "agent-framework-declarative==1.0.0b260107",  # Pin to compatible version
    "azure-identity>=1.15.0",
    "azure-ai-projects>=1.0.0",
    "azure-storage-blob>=12.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "requests>=2.32.3",  # Updated for prance compatibility
    "pydantic>=2.12.4,<3.0",
    "python-dotenv>=1.0.0",
    "mcp",
    "opentelemetry-exporter-otlp-proto-grpc",  # Required for OTLP gRPC exporters
    "azure-ai-agentserver-core==1.0.0b10",  # HTTP server hosting
    "azure-ai-agentserver-agentframework==1.0.0b10",  # Agent framework server integration
    "opencv-python",
    "pywin32>=311; platform_system=='Windows'",  # Windows-specific dependency for MCP
    "jiter>=0.13.0",  # Fast JSON parsing, explicit for ARM64 Windows compatibility
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "debugpy",
    "agent-dev-cli",
    "pythonnet>=3.0.0",  # .NET integration for tests
    "cffi>=2.0.0",  # Explicit dependency for ARM64 Windows compatibility
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
